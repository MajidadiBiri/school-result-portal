<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3MTT School Result Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h2 {
            color: #007a43;
            margin-bottom: 20px;
        }
        p {
            color: #555555;
            font-size: 14px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
        }
        button {
            width: 100%;
            background-color: #007a43;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #005c32;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #eef7f2;
            text-align: left;
            display: none;
        }
        .result-box h3 {
            margin-top: 0;
            color: #007a43;
        }
        .error {
            color: red;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>3MTT School Result Portal</h2>
    <p>Shigar da Student ID dinka domin duba sakamako (Try: STU101):</p>
    
    <input type="text" id="studentId" placeholder="STU101">
    <button onclick="checkResult()">Duba Sakamako (Check Result)</button>

    <div id="errorMsg" class="error"></div>

    <div id="resultBox" class="result-box">
        <h3 id="studentName"></h3>
        <p><strong>Student ID:</strong> <span id="displayId"></span></p>
        <hr>
        <p><strong>Mathematics:</strong> <span id="mathScore"></span>%</p>
        <p><strong>English:</strong> <span id="englishScore"></span>%</p>
        <p><strong>Science:</strong> <span id="scienceScore"></span>%</p>
    </div>
</div>

<script>
    async function checkResult() {
        const studentId = document.getElementById('studentId').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultBox = document.getElementById('resultBox');

        errorMsg.innerText = '';
        resultBox.style.display = 'none';

        if (!studentId) {
            errorMsg.innerText = 'Tabbatar ka shigar da Student ID!';
            return;
        }

        try {
            const response = await fetch(`/api/result/${studentId}`);
            if (!response.ok) {
                throw new Error('Sakamako ba a same shi ba');
            }
            const data = await response.json();

            document.getElementById('studentName').innerText = `Sakamakon: ${data.name}`;
            document.getElementById('displayId').innerText = data.student_id;
            document.getElementById('mathScore').innerText = data.math;
            document.getElementById('englishScore').innerText = data.english;
            document.getElementById('scienceScore').innerText = data.science;

            resultBox.style.display = 'block';
        } catch (err) {
            errorMsg.innerText = 'An samu matsala wajen sadarwa ko babu wannan ID din';
        }
    }
</script>

</body>
</html>
